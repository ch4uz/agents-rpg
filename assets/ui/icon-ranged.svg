<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art bow (ranged attack). Wooden recurve stave bulging left (lit outer
       edge + shadowed inner edge), a taut grey bowstring, and a nocked arrow:
       tan shaft, red fletching, steel head poking out to the right. -->
  <!-- bowstring (drawn first, sits behind stave + arrow) -->
  <g fill="#dfe4ec"><rect x="9" y="2" width="1" height="11"/></g>
  <!-- stave: shadowed inner (right) edge -->
  <g fill="#6b4a22">
    <rect x="9" y="1" width="1" height="1"/>
    <rect x="8" y="2" width="1" height="1"/>
    <rect x="7" y="3" width="1" height="1"/>
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="4" y="6" width="1" height="1"/>
    <rect x="3" y="7" width="1" height="2"/>
    <rect x="4" y="9" width="1" height="1"/>
    <rect x="5" y="10" width="1" height="1"/>
    <rect x="6" y="11" width="1" height="1"/>
    <rect x="7" y="12" width="1" height="1"/>
    <rect x="8" y="13" width="1" height="1"/>
    <rect x="9" y="14" width="1" height="1"/>
  </g>
  <!-- stave: lit outer (left) edge -->
  <g fill="#c2913f">
    <rect x="8" y="1" width="1" height="1"/>
    <rect x="7" y="2" width="1" height="1"/>
    <rect x="6" y="3" width="1" height="1"/>
    <rect x="5" y="4" width="1" height="1"/>
    <rect x="4" y="5" width="1" height="1"/>
    <rect x="3" y="6" width="1" height="1"/>
    <rect x="2" y="7" width="1" height="2"/>
    <rect x="3" y="9" width="1" height="1"/>
    <rect x="4" y="10" width="1" height="1"/>
    <rect x="5" y="11" width="1" height="1"/>
    <rect x="6" y="12" width="1" height="1"/>
    <rect x="7" y="13" width="1" height="1"/>
    <rect x="8" y="14" width="1" height="1"/>
  </g>
  <!-- arrow: red fletching at the nock -->
  <g fill="#c43b3b">
    <rect x="4" y="6" width="1" height="1"/>
    <rect x="4" y="7" width="2" height="2"/>
    <rect x="4" y="9" width="1" height="1"/>
  </g>
  <!-- arrow: tan shaft -->
  <g fill="#c9b48a"><rect x="6" y="7" width="5" height="1"/></g>
  <g fill="#a07d4a"><rect x="6" y="8" width="5" height="1"/></g>
  <!-- arrow: steel head pointing right -->
  <g fill="#c2cad6">
    <rect x="11" y="5" width="1" height="6"/>
    <rect x="12" y="6" width="1" height="4"/>
    <rect x="13" y="7" width="1" height="2"/>
  </g>
</svg>
