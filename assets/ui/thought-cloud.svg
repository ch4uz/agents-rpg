<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 14" shape-rendering="crispEdges">
  <!-- Pixel-art thought cloud (collapsed balloon). Dark ink outline, parchment
       body, top-left shine, bottom shade. Two top bumps with a 2px valley at
       x14-15 so it reads as a cloud, not a pill. Same rect-grid style as the
       assets/ui/icon-*.svg set. Display at 2x (48x28px). -->
  <g fill="#2a2421">
    <rect x="6" y="1" width="6" height="1"/>
    <rect x="5" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/>
    <rect x="4" y="3" width="1" height="1"/><rect x="13" y="3" width="1" height="1"/><rect x="16" y="3" width="4" height="1"/>
    <rect x="3" y="4" width="1" height="1"/><rect x="14" y="4" width="2" height="1"/><rect x="20" y="4" width="1" height="1"/>
    <rect x="2" y="5" width="1" height="1"/><rect x="21" y="5" width="1" height="1"/>
    <rect x="1" y="6" width="1" height="1"/><rect x="22" y="6" width="1" height="1"/>
    <rect x="0" y="7" width="1" height="1"/><rect x="23" y="7" width="1" height="1"/>
    <rect x="0" y="8" width="1" height="1"/><rect x="23" y="8" width="1" height="1"/>
    <rect x="0" y="9" width="1" height="1"/><rect x="23" y="9" width="1" height="1"/>
    <rect x="1" y="10" width="1" height="1"/><rect x="22" y="10" width="1" height="1"/>
    <rect x="2" y="11" width="1" height="1"/><rect x="21" y="11" width="1" height="1"/>
    <rect x="3" y="12" width="2" height="1"/><rect x="19" y="12" width="2" height="1"/>
    <rect x="5" y="13" width="14" height="1"/>
  </g>
  <g fill="#f4ecd6">
    <rect x="9" y="2" width="3" height="1"/>
    <rect x="7" y="3" width="6" height="1"/>
    <rect x="4" y="4" width="10" height="1"/><rect x="16" y="4" width="4" height="1"/>
    <rect x="3" y="5" width="18" height="1"/>
    <rect x="2" y="6" width="20" height="1"/>
    <rect x="1" y="7" width="22" height="1"/>
    <rect x="1" y="8" width="22" height="1"/>
    <rect x="1" y="9" width="22" height="1"/>
    <rect x="2" y="10" width="20" height="1"/>
    <rect x="3" y="11" width="18" height="1"/>
  </g>
  <g fill="#fdf6e3">
    <rect x="6" y="2" width="3" height="1"/>
    <rect x="5" y="3" width="2" height="1"/>
  </g>
  <g fill="#d9ccab">
    <rect x="5" y="12" width="14" height="1"/>
  </g>
</svg>
