<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Thought Balloon — Standalone Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" />
  <style>
    :root {
      --wood-dark:  #2a2118;
      --wood-mid:   #5a4a35;
      --wood-light: #8a7148;
      --ink:        #f5e9c8;
      --accent:     #f0b04c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--wood-dark); color: var(--ink);
      font-family: 'Jersey 10', system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 1000px; margin: 0 auto; padding: 32px 24px;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    header { width: 100%; }
    header h1 { margin: 0 0 6px; font-size: 36px; letter-spacing: 1px; color: var(--accent); }
    header p { margin: 0; opacity: 0.7; font-size: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    button {
      background: var(--wood-mid); color: var(--ink);
      border: 2px solid var(--wood-light); border-radius: 6px;
      padding: 10px 16px; font-family: inherit; font-size: 18px; cursor: pointer;
    }
    button:hover { background: var(--wood-light); }

    /* Fake board: a stone-checker floor with two hero tokens, mirroring the
       in-game canvas scale (cell ~48px, sprites ~1.6x). */
    #board-host {
      position: relative;
      width: 720px; height: 480px;
      background:
        repeating-conic-gradient(#2a2620 0% 25%, #231f1a 0% 50%) 0 0 / 96px 96px;
      border: 3px solid var(--wood-mid); border-radius: 8px;
      overflow: visible;
    }
    .hero {
      position: absolute;
      width: 76px; height: 76px;
      image-rendering: pixelated;
      transform: translate(-50%, -100%);
    }
    .hero-label {
      position: absolute;
      transform: translate(-50%, 0);
      font-size: 16px; opacity: 0.65; letter-spacing: 0.05em;
    }
    /* The overlay the balloons mount into — mirrors .mini-bar-layer. */
    #overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      overflow: visible;
    }
    #status { width: 100%; white-space: pre-wrap; opacity: 0.85; font-size: 18px; min-height: 24px; }
  </style>
  <link rel="stylesheet" href="./styles/thought-balloon.css" />
</head>
<body>
  <main>
    <header>
      <h1>Thought Balloon</h1>
      <p>Pixel cloud + pulsing dots over a thinking hero. Hover the cloud to read the live streamed thought.</p>
    </header>
    <div class="controls" id="controls">
      <button data-action="restart">Restart stream ▶</button>
      <button data-action="long">Long thought</button>
      <button data-action="empty">Dots only (no text yet)</button>
      <button data-action="toggle">Toggle thinking on/off</button>
    </div>
    <div id="board-host">
      <div id="overlay"></div>
    </div>
    <pre id="status"></pre>
  </main>
  <script type="module" src="./thought-test.ts"></script>
</body>
</html>
